<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi experiencia escolar puede mejorar la tuya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#e3f2fd,#fff3e0);
    width:100%;
    overflow-x:hidden;
}

/* HEADER */
header{
    text-align:center;
    background: linear-gradient(90deg,#1f3b73,#2e7d32);
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    width:100%;
}

/* BUSCADOR */
.search{
    text-align:center;
    padding:15px;
    background:white;
    width:100%;
}

.search input{
    width:85%;
    max-width:450px;
    min-width:220px;
    padding:10px;
    border-radius:25px;
    border:2px solid #1f3b73;
    outline:none;
    font-size:14px;
}

/* MENUS EN UNA SOLA FILA ARRIBA */
.menu{
    display:flex;
    flex-wrap:nowrap;
    justify-content:center;
    align-items:flex-start;
    gap:8px;
    padding:15px;
    width:100%;
    overflow-x:auto;
    margin:auto;
    -webkit-overflow-scrolling:touch;
}

.button{
    flex:0 0 auto;
    background:#1f3b73;
    color:white;
    text-align:center;
    padding:10px 12px;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:0.3s;
    font-size:12px;
    white-space:nowrap;
}

.button:hover{
    background:#2e7d32;
    transform:scale(1.05);
}

/* IMAGEN PRINCIPAL */
.main-image{
    text-align:center;
    padding:20px;
    width:100%;
}

.main-image img{
    width:90%;
    max-width:800px;
    height:auto;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* TABLETS */
@media(max-width:768px){

    header{
        font-size:20px;
        padding:18px 10px;
    }

    .search input{
        width:92%;
        font-size:13px;
    }

    .button{
        font-size:11px;
        padding:8px 10px;
    }

    .main-image img{
        width:95%;
    }
}

/* CELULARES PEQUEÑOS */
@media(max-width:480px){

    header{
        font-size:17px;
        line-height:1.4;
    }

    .search{
        padding:12px;
    }

    .search input{
        width:95%;
        padding:9px;
        font-size:12px;
    }

    .menu{
        gap:6px;
        padding:10px;
    }

    .button{
        font-size:10px;
        padding:7px 9px;
    }

    .main-image{
        padding:10px;
    }

    .main-image img{
        width:100%;
        border-radius:15px;
    }
}
</style>
</head>

<body>

<header>
MI EXPERIENCIA ESCOLAR PUEDE MEJORAR LA TUYA
</header>

<!-- BUSCADOR -->
<div class="search">
<input type="text" id="buscador" placeholder="🔍 Buscar menú..." onkeyup="filtrar()">
</div>

<!-- MENUS EN UNA SOLA FILA -->
<div class="menu" id="menu">

<a class="button" href="menu1.html">Abandono</a>
<a class="button" href="menu2.html">Consecuencias</a>
<a class="button" href="menu3.html">Testimonios</a>
<a class="button" href="menu4.html">Prevención</a>
<a class="button" href="menu5.html">Familia</a>
<a class="button" href="menu6.html">Apoyo</a>

</div>

<!-- IMAGEN -->
<div class="main-image">
<h5></h5>
<img src="PRINCIPAL.jpeg" alt="imagen principal">
</div>

<script>
function filtrar(){
    let input=document.getElementById("buscador").value.toLowerCase();
    let buttons=document.getElementsByClassName("button");

    for(let i=0;i<buttons.length;i++){
        let text=buttons[i].innerText.toLowerCase();
        buttons[i].style.display=text.includes(input)?"":"none";
    }
}
</script>

</body>
</html>
